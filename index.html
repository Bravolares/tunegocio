<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital</title>
    <!-- Vinculación del diseño CSS externo -->
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <header>
        <!-- Ahora es una imagen que al darle clic ejecuta la función openLogoModal() -->
<img id="emp-logo" class="logo-img-header" src="" alt="Logo" onclick="openLogoModal()" style="cursor: pointer;">

        <div class="header-info">
            <h1 id="emp-nombre">Cargando...</h1>
            <p id="emp-eslogan">Cargando...</p>
        </div>
        <div class="boton-superior-contenedor">
        <a href="mapa/mapa.html" class="mi-boton">Ir a otra página</a>
    </div>
    </header>

    <div class="categories">
        <button class="cat-btn active" onclick="filterCategory('Platos', this)">Platos</button>
        <button class="cat-btn" onclick="filterCategory('Bebidas', this)">Bebidas</button>
        <button class="cat-btn" onclick="filterCategory('Domicilio', this)">Domicilio</button>
    </div>

    <div class="catalog" id="catalog-container"></div>

    <div class="fixed-bar">
        <div class="total-box">Total: $<span id="total-val">0</span> COP</div>
        <button class="btn-whatsapp" onclick="sendOrder()">Hacer pedido por WhatsApp</button>
    </div>


    <!-- Ventana flotante de detalles e ingredientes -->
    <div class="modal" id="product-modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <img src="" class="modal-img" id="modal-img" alt="Detalle">
            <div class="modal-body">
                <h2 class="modal-title" id="modal-title">Producto</h2>
                <div class="modal-ingredients" id="modal-desc">Ingredientes</div>
            </div>
        </div>
    </div>

<!-- >>> PEGA ESTE BLOQUE JUSTO AQUÍ <<< -->
    <!-- Ventana flotante exclusiva para ver el logo ampliado -->
    <div class="modal" id="logo-modal" onclick="closeLogoModal()">
        <div class="modal-content logo-modal-adjustment" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeLogoModal()">&times;</span>
            <h3 id="logo-modal-title" style="margin-bottom: 15px; font-size: 1.2rem; font-family: inherit;">Logo Empresa</h3>
            <img id="logo-modal-img" src="" alt="Logo Ampliado" style="width: 100%; max-height: 300px; object-fit: contain; border-radius: 8px;">
        </div>
    </div>

    <!-- Vinculación de las funciones de lógica lógica externa -->
    <script src="index.js"></script>
</body>
</html>
