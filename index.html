<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla Responsiva Enlace</title>
    <style>
        /* Fondo negro puro inmediato y eliminación de márgenes */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Contenedor flexible para centrado absoluto en cualquier pantalla */
        .contenedor-centrado {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 20px;
        }

        /* El texto H2 ahora contiene el enlace */
        .texto-degradado {
            font-size: clamp(2rem, 5vw, 4rem); /* Ajuste de tamaño fluido según la pantalla */
            font-weight: 700;
            text-align: center;
            margin: 0;
        }

        /* Estilos aplicados directamente al enlace para mantener el degradado */
        .texto-degradado a {
            text-decoration: none; /* Quita la línea de subrayado común de los enlaces */
            
            /* Efecto de degradado en el texto */
            background: linear-gradient(to bottom, #ffffff 0%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="contenedor-centrado">
        <h2 class="texto-degradado">
            <!-- Reemplaza "tu-pagina.html" por la URL que quieres abrir -->
            <!-- Reemplaza "nombre_de_tu_frame" por el name exacto de tu iframe -->
            <a href="https://mifavorito.xo.je/" target="nombre_de_tu_frame">E N T R A R</a>
        </h2>
    </div>

</body>
</html>
