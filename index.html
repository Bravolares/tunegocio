<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contenedor Web con Barra Superior</title>
    <style>
        /* Reseteo básico y eliminación de barras de scroll duplicadas */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Contenedor principal en formato Flexbox vertical */
        .pantalla-completa {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        /* Franja superior fija de color azul celeste */
        .barra-superior {
            background-color: #87CEEB; /* Azul celeste */
            height: 60px;
            display: flex;
            justify-content: center; /* Centra los botones horizontalmente */
            align-items: center;     /* Centra los botones verticalmente */
            gap: 15px;               /* Separación entre botones */
            padding: 0 10px;
            box-sizing: border-box;
            flex-shrink: 0;          /* Evita que la barra se aplaste */
        }

        /* Botones ovalados, negros con texto blanco que se adaptan al título */
        .boton-enlace {
            background-color: #000000; /* Negro sólido */
            color: #FFFFFF;            /* Texto blanco */
            text-decoration: none;     /* Quita el subrayado del enlace */
            padding: 10px 20px;        /* Espaciado interno (hace que se adapte al texto) */
            border-radius: 50px;       /* Forma ovalada */
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            text-align: center;
            white-space: nowrap;       /* Evita que el texto se rompa en dos líneas */
            transition: background-color 0.3s ease;
        }

        /* Efecto visual cuando pasas el mouse por encima del botón */
        .boton-enlace:hover {
            background-color: #333333; /* Negro un poco más claro al pasar el cursor */
        }

        /* El iframe ocupa todo el espacio de pantalla restante */
        .contenedor-frame {
            flex-grow: 1;              /* Toma todo el alto disponible */
            width: 100%;
            border: none;              /* Elimina bordes del iframe */
            display: block;
        }
    </style>
</head>
<body>

    <div class="pantalla-completa">
        
        <!-- Franja Celeste con 3 Botones Centrados -->
        <header class="barra-superior">
            <!-- Cambia las URL (#) y los textos según tus necesidades -->
           <a href="http://mifavorito.xo.je/?i=1" target="mi_frame" class="boton-enlace">Este Botón es Más Largo</a>
            <a href="index2.html" target="mi_frame" class="boton-enlace">Contacto</a>
        </header>

        <!-- Web de Conexión (Iframe) debajo de la franja -->
        <!-- Reemplaza "https://tu-sitio-web.com" por tu página principal -->
        <iframe src="index2.html" class="contenedor-frame" name="mi_frame"></iframe>

    </div>

</body>
</html>
